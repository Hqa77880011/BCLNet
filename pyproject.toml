[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bclnet"
version = "0.1.0"
description = "Boundary-Calibrated Lightweight Network for Domain-Generalized Polyp Segmentation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
bclnet = "bclnet.cli:main"

[tool.setuptools.packages.find]
include = ["bclnet*"]

[project.optional-dependencies]
image-metrics = ["lpips>=0.1.4", "pysodmetrics>=1.4"]
